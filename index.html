<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeepRadar - Pinellas & Tampa Bay</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #111418; color: #fff; font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }
    header { height: 56px; background: #1b2026; border-bottom: 2px solid #ff9800; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    .brand { font-weight: 800; font-size: 1.1rem; color: #fff; }
    .brand span { color: #ff9800; }
    .btn { background: #242b33; border: 1px solid #333d49; color: #fff; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; }
    .btn-amber { background: #ff9800; color: #111418; border: none; }
    #map { flex: 1; width: 100%; background: #0d1013; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; align-items: center; justify-content: center; }
    .modal.open { display: flex; }
    .modal-content { background: #1b2026; border: 1px solid #ff9800; padding: 20px; border-radius: 10px; width: 320px; }
    .form-control { width: 100%; background: #111418; border: 1px solid #333d49; color: #fff; padding: 8px; margin-bottom: 10px; border-radius: 4px; box-sizing: border-box; }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">JEEP<span>RADAR</span></div>
    <div>
      <button class="btn btn-amber" onclick="openSubmitModal()">+ Submit</button>
      <button class="btn" onclick="toggleAdmin()">Admin</button>
    </div>
  </header>
  <div id="map"></div>
</div>

<!-- Submit Modal -->
<div class="modal" id="modal-add">
  <div class="modal-content">
    <h3 style="color:#ff9800; margin-top:0;">Submit Meetup</h3>
    <input type="text" id="ev-title" class="form-control" placeholder="Event Title (e.g., Sunset Meet)">
    <input type="text" id="ev-club" class="form-control" placeholder="Club Name">
    <div style="display:flex; justify-content:flex-end; gap:6px; margin-top:10px;">
      <button class="btn" onclick="closeSubmitModal()">Cancel</button>
      <button class="btn btn-amber" onclick="saveEvent()">Save</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map = L.map('map').setView([27.82, -82.68], 11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { subdomains: 'abcd', maxZoom: 19 }).addTo(map);

  function openSubmitModal() {
    document.getElementById('modal-add').classList.add('open');
  }

  function closeSubmitModal() {
    document.getElementById('modal-add').classList.remove('open');
  }

  function saveEvent() {
    const title = document.getElementById('ev-title').value;
    if(!title) { alert('Enter a title'); return; }
    alert('Event saved: ' + title);
    closeSubmitModal();
  }

  function toggleAdmin() {
    const pin = prompt("Enter Admin PIN (1974):");
    if(pin === "1974") {
      alert("Admin Unlocked!");
    } else if(pin !== null) {
      alert("Wrong PIN");
    }
  }
</script>
</body>
</html>
