<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JeepRadar - Pinellas & Tampa Bay</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg-dark: #111418; --bg-panel: #1b2026; --bg-card: #242b33;
      --border: #333d49; --amber: #ff9800; --green: #4caf50;
      --cyan: #00e5ff; --red: #ff3b30; --yellow: #ffd600;
      --text-main: #f0f4f8; --text-muted: #9aa6b5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background: var(--bg-dark); color: var(--text-main); font-family: sans-serif; overflow: hidden; }
    #app { display: flex; flex-direction: column; width: 100%; height: 100vh; position: relative; }

    header {
      height: 56px; background: var(--bg-panel); border-bottom: 2px solid var(--amber);
      display: flex; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 1000;
    }
    .brand { font-weight: 800; font-size: 1.1rem; color: #fff; display: flex; align-items: center; gap: 6px; }
    .brand span { color: var(--amber); }

    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--amber); display: inline-block; margin-left: 4px; box-shadow: 0 0 6px var(--amber); }
    .sync-dot.cloud { background: var(--green); box-shadow: 0 0 6px var(--green); }

    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-main);
      padding: 6px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .btn-amber { background: var(--amber); border-color: var(--amber); color: #111418; font-weight: 700; }
    .btn-admin.unlocked { border-color: var(--green); color: var(--green); }
    .badge-count { background: var(--red); color: #fff; font-size: 0.7rem; padding: 1px 5px; border-radius: 10px; font-weight: 800; }

    .filter-bar {
      display: flex; gap: 8px; padding: 8px 12px; background: #15191e; border-bottom: 1px solid var(--border);
      overflow-x: auto; white-space: nowrap; z-index: 1000;
    }
    .chip {
      background: var(--bg-card); border: 1px solid var(--border); color: var(--text-muted);
      padding: 5px 12px; border-radius: 18px; font-size: 0.78rem; font-weight: 600; cursor: pointer;
    }
    .chip.active { background: var(--amber); border-color: var(--amber); color: #111418; }
    .chip-pending { border-color: var(--yellow); color: var(--yellow); display: none; }
    .chip-pending.active { background: var(--yellow); color: #111418; }

    #map { flex: 1; width: 100%; background: #0d1013; }

    .drawer {
      background: var(--bg-panel); border-top: 2px solid var(--border); border-radius: 16px 16px 0 0;
      z-index: 1000; display: flex; flex-direction: column; max-height: 40vh; transition: max-height 0.2s ease;
    }
    .drawer.collapsed { max-height: 40px; }
    .drawer-header { padding: 10px 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
    .event-list { overflow-y: auto; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; }

    .event-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px; cursor: pointer; }
    .event-card.pending-card { border: 1px dashed var(--yellow); background: rgba(255, 214, 0, 0.05); }
    .event-card h4 { font-size: 0.9rem; color: #fff; margin-bottom: 2px; }
    .event-card p { font-size: 0.78rem; color: var(--text-muted); }
    .card-actions { display: flex; gap: 6px; margin-top: 8px; }
    .btn-sm { padding: 3px 8px; font-size: 0.7rem; border-radius: 4px; font-weight: 700; border: none; cursor: pointer; }
    .btn-approve { background: var(--green); color: #000; }
    .btn-delete { background: var(--red); color: #fff; }

    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: none;
      align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal { background: var(--bg-panel); border: 1px solid var(--amber); border-radius: 10px; width: 100%; max-width: 400px; padding: 16px; max-height: 90vh; overflow-y: auto; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 3px; font-weight: 700; }
    .form-control { width: 100%; background: var(--bg-dark); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; font-size: 0.85rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: 6px; margin-top: 14px; }

    #toast {
      position: fixed; top: 65px; left: 50%; transform: translateX(-50%); background: #1b2026;
      border: 1px solid var(--amber); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 0.8rem; z-index: 4000; display: none;
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div class="brand">
      JEEP<span>RADAR</span>
      <span id="sync-dot" class="sync-dot" title="Local Mode"></span>
    </div>
    <div class="header-actions">
      <button class="btn btn-amber" id="btn-add-open">+ Submit</button>
      <button class="btn" id="btn-locate">GPS</button>
      <button class="btn btn-admin" id="btn-admin">
        <span id="admin-label">Admin</span>
        <span id="pending-badge" class="badge-count" style="display:none;">0</span>
      </button>
      <button class="btn" id="btn-cloud" title="Cloud Settings">⚙️</button>
    </div>
  </header>

  <div class="filter-bar">
    <button class="chip active" data-filter="all">All Approved</button>
    <button class="chip" data-filter="hangout">Hangouts</button>
    <button class="chip" data-filter="meet">Meets</button>
    <button class="chip" data-filter="trail">Trails</button>
    <button class="chip chip-pending" id="chip-pending" data-filter="pending">⏳ Pending</button>
  </div>

  <div id="map"></div>

  <div class="drawer" id="drawer">
    <div class="drawer-header" id="drawer-toggle">
      <span style="font-size:0.8rem; font-weight:800; color:var(--amber);">Pinellas & Tampa Bay Feed <span id="spot-count">(0)</span></span>
      <span id="drawer-toggle-txt" style="font-size:0.75rem; color:var(--text-muted);">▼ Hide</span>
    </div>
    <div class="event-list" id="event-list"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Submit Modal -->
<div class="modal-backdrop" id="modal-add">
  <div class="modal">
    <h3 style="color:var(--amber); font-size:1rem; margin-bottom:10px;">Submit Jeep Meetup</h3>
    <form id="form-event">
      <input type="hidden" id="ev-lat">
      <input type="hidden" id="ev-lng">
      <div class="form-group">
        <label>Title *</label>
        <input type="text" id="ev-title" class="form-control" placeholder="e.g., Pass-a-Grille Sunset" required>
      </div>
      <div class="form-group">
        <label>Club / Host *</label>
        <input type="text" id="ev-club" class="form-control" placeholder="e.g., St. Pete Beach Jeepers" required>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="ev-type" class="form-control">
          <option value="hangout">Hangout (Green)</option>
          <option value="meet">Meet & Cruise (Amber)</option>
          <option value="trail">Trail / Sand (Cyan)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Schedule / Date *</label>
        <input type="text" id="ev-schedule" class="form-control" placeholder="e.g., Every Friday @ Sunset" required>
      </div>
      <div class="form-group">
        <label>Notes / Parking *</label>
        <textarea id="ev-desc" class="form-control" rows="2" placeholder="Where to park..." required></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn" id="btn-add-cancel">Cancel</button>
        <button type="submit" class="btn btn-amber">Submit</button>
      </div>
    </form>
  </div>
</div>

<!-- Cloud Sync Modal -->
<div class="modal-backdrop" id="modal-cloud">
  <div class="modal">
    <h3 style="color:var(--amber); font-size:1rem; margin-bottom:10px;">JSONBin.io Cloud Setup</h3>
    <p style="font-size:0.75rem; color:var(--text-muted); margin-bottom:10px;">Connect your free JSONBin.io account so all Jeeper phones sync automatically.</p>
    <div class="form-group">
      <label>X-Master-Key</label>
      <input type="password" id="cloud-key" class="form-control" placeholder="$2a$10$...">
    </div>
    <div class="form-group">
      <label>Bin ID (Leave blank to auto-create)</label>
      <input type="text" id="cloud-bin" class="form-control" placeholder="6710a8bc...">
    </div>
    <div style="margin-bottom:10px;">
      <button type="button" class="btn btn-amber" id="btn-create-bin" style="width:100%;">Auto-Create New Bin</button>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="btn-cloud-close">Close</button>
      <button type="button" class="btn btn-amber" id="btn-cloud-save">Save & Sync</button>
    </div>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const ADMIN_PIN = "1974";
    let isAdmin = false;
    let currentFilter = "all";
    let markersLayer = [];

    const DEFAULT_SPOTS = [
      { id: "1", title: "Pass-a-Grille Sunset Tailgate", club: "St. Pete Beach Jeepers", type: "hangout", schedule: "Weekends @ Sunset", lat: 27.6896, lng: -82.7388, desc: "South end beach parking lot lineup.", status: "approved" },
      { id: "2", title: "St. Pete Pier Approach Staging", club: "Sunshine City Jeep Crew", type: "meet", schedule: "Every Friday 7:30 PM", lat: 27.7719, lng: -82.6288, desc: "Downtown waterfront meetup.", status: "approved" },
      { id: "3", title: "Gandy Beach Sand Line", club: "Tampa Bay Jeep Club", type: "trail", schedule: "Open Daily", lat: 27.8732, lng: -82.5714, desc: "Waterfront sand pull-in.", status: "approved" },
      { id: "4", title: "Courtney Campbell Causeway Ramp", club: "Tampa Bay Jeep Club", type: "hangout", schedule: "Sundays 10:00 AM", lat: 27.9691, lng: -82.6025, desc: "Bayfront meetup by boat ramp.", status: "approved" },
      { id: "5", title: "Madeira Beach Causeway Marina Lot", club: "St. Pete Beach Jeepers", type: "meet", schedule: "Saturday Mornings", lat: 27.7995, lng: -82.7937, desc: "Intracoastal breeze meetup.", status: "approved" }
    ];

    let spots = [...DEFAULT_SPOTS];
    const saved = localStorage.getItem("jr_spots");
    if (saved) {
      try { spots = JSON.parse(saved); } catch(e) {}
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => { t.style.display = "none"; }, 3000);
    }

    // Initialize Map
    const map = L.map("map", { zoomControl: false }).setView([27.82, -82.68], 11);
    L.control.zoom({ position: "right" }).addTo(map);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      subdomains: "abcd", maxZoom: 19
    }).addTo(map);

    function makePin(color, isPending = false) {
      const border = isPending ? "2px dashed #ffd600" : "2px solid #fff";
      return L.divIcon({
        className: "custom-pin",
        html: `<div style="background:${color}; width:14px; height:14px; border-radius:50%; border:${border}; box-shadow:0 0 8px ${color};"></div>`,
        iconSize: [16, 16], iconAnchor: [8, 8]
      });
    }

    const ICONS = {
      hangout: makePin("#4caf50"),
      meet: makePin("#ff9800"),
      trail: makePin("#00e5ff"),
      pending: makePin("#ffd600", true)
    };

    function render() {
      markersLayer.forEach(m => map.removeLayer(m));
      markersLayer = [];

      const listEl = document.getElementById("event-list");
      listEl.innerHTML = "";

      const pendingCount = spots.filter(s => s.status === "pending").length;
      const badge = document.getElementById("pending-badge");
      if (pendingCount > 0) {
        badge.style.display = "inline-block";
        badge.textContent = pendingCount;
      } else {
        badge.style.display = "none";
      }

      const filtered = spots.filter(s => {
        if (!isAdmin && s.status === "pending") return false;
        if (currentFilter === "pending") return s.status === "pending";
        if (s.status === "pending") return false;
        if (currentFilter !== "all" && s.type !== currentFilter) return false;
        return true;
      });

      document.getElementById("spot-count").textContent = `(${filtered.length})`;

      filtered.forEach(spot => {
        const isPending = spot.status === "pending";
        const icon = isPending ? ICONS.pending : (ICONS[spot.type] || ICONS.meet);

        const marker = L.marker([spot.lat, spot.lng], { icon }).addTo(map);
        marker.bindPopup(`<b>${spot.title}</b><br>${spot.club}<br>${spot.schedule}`);
        markersLayer.push(marker);

        const card = document.createElement("div");
        card.className = "event-card" + (isPending ? " pending-card" : "");
        card.innerHTML = `
          <h4>${isPending ? "⏳ [PENDING APPROVAL] " : ""}${spot.title}</h4>
          <p><b>${spot.club}</b> • ${spot.schedule}</p>
          <p>${spot.desc}</p>
          ${isAdmin ? `<div class="card-actions">
            ${isPending ? `<button class="btn-sm btn-approve" data-act="approve" data-id="${spot.id}">✓ Approve</button>` : ""}
            <button class="btn-sm btn-delete" data-act="delete" data-id="${spot.id}">✕ Delete</button>
          </div>` : ""}
        `;

        card.addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON") return;
          map.setView([spot.lat, spot.lng], 14);
          marker.openPopup();
        });

        listEl.appendChild(card);
      });

      document.querySelectorAll("[data-act]").forEach(b => {
        b.addEventListener("click", (e) => {
          e.stopPropagation();
          const id = b.getAttribute("data-id");
          const act = b.getAttribute("data-act");
          if (act === "approve") {
            spots = spots.map(s => s.id === id ? {...s, status: "approved"} : s);
            showToast("Event Approved & Live!");
          } else if (act === "delete") {
            spots = spots.filter(s => s.id !== id);
            showToast("Event Deleted.");
          }
          saveAndSync();
        });
      });
    }

    function saveAndSync() {
      localStorage.setItem("jr_spots", JSON.stringify(spots));
      render();
    }

    // Button Event Handlers (Safe & Protected)
    const adminBtn = document.getElementById("btn-admin");
    if(adminBtn) {
      adminBtn.addEventListener("click", () => {
        if (isAdmin) {
          isAdmin = false;
          adminBtn.classList.remove("unlocked");
          document.getElementById("admin-label").textContent = "Admin";
          document.getElementById("chip-pending").style.display = "none";
          if (currentFilter === "pending") currentFilter = "all";
          showToast("Admin Locked.");
          render();
          return;
        }
        const pin = prompt("Enter Admin PIN (1974):");
        if (pin === ADMIN_PIN) {
          isAdmin = true;
          adminBtn.classList.add("unlocked");
          document.getElementById("admin-label").textContent = "🔓 Admin";
          document.getElementById("chip-pending").style.display = "inline-block";
          showToast("Admin Unlocked!");
          render();
        } else if (pin !== null) {
          alert("Incorrect PIN.");
        }
      });
    }

    document.getElementById("btn-add-open").addEventListener("click", () => {
      const c = map.getCenter();
      document.getElementById("ev-lat").value = c.lat.toFixed(4);
      document.getElementById("ev-lng").value = c.lng.toFixed(4);
      document.getElementById("modal-add").classList.add("open");
    });

    document.getElementById("btn-add-cancel").addEventListener("click", () => {
      document.getElementById("modal-add").classList.remove("open");
    });

    document.getElementById("form-event").addEventListener("submit", (e) => {
      e.preventDefault();
      const newSpot = {
        id: "ev-" + Date.now(),
        title: document.getElementById("ev-title").value,
        club: document.getElementById("ev-club").value,
        type: document.getElementById("ev-type").value,
        schedule: document.getElementById("ev-schedule").value,
        lat: parseFloat(document.getElementById("ev-lat").value),
        lng: parseFloat(document.getElementById("ev-lng").value),
        desc: document.getElementById("ev-desc").value,
        status: isAdmin ? "approved" : "pending"
      };

      spots.unshift(newSpot);
      document.getElementById("modal-add").classList.remove("open");
      document.getElementById("form-event").reset();
      saveAndSync();
      showToast(isAdmin ? "Meetup Added Live!" : "Submitted for Admin Approval!");
    });

    document.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => {
        document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
        chip.classList.add("active");
        currentFilter = chip.getAttribute("data-filter");
        render();
      });
    });

    document.getElementById("drawer-toggle").addEventListener("click", () => {
      const d = document.getElementById("drawer");
      d.classList.toggle("collapsed");
      document.getElementById("drawer-toggle-txt").textContent = d.classList.contains("collapsed") ? "▲ Show" : "▼ Hide";
      setTimeout(() => map.invalidateSize(), 200);
    });

    document.getElementById("btn-locate").addEventListener("click", () => {
      if (!navigator.geolocation) { showToast("GPS not supported."); return; }
      navigator.geolocation.getCurrentPosition(pos => {
        map.setView([pos.coords.latitude, pos.coords.longitude], 13);
        showToast("Located!");
      });
    });

    // Cloud modal controls
    document.getElementById("btn-cloud").addEventListener("click", () => {
      document.getElementById("cloud-key").value = localStorage.getItem("jr_bin_key") || "";
      document.getElementById("cloud-bin").value = localStorage.getItem("jr_bin_id") || "";
      document.getElementById("modal-cloud").classList.add("open");
    });

    document.getElementById("btn-cloud-close").addEventListener("click", () => {
      document.getElementById("modal-cloud").classList.remove("open");
    });

    document.getElementById("btn-create-bin").addEventListener("click", async () => {
      const key = document.getElementById("cloud-key").value.trim();
      if (!key) { alert("Enter X-Master-Key first."); return; }
      try {
        const res = await fetch("https://api.jsonbin.io/v3/b", {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Master-Key": key, "X-Bin-Name": "JeepRadar" },
          body: JSON.stringify({ spots: spots })
        });
        if (res.ok) {
          const data = await res.json();
          document.getElementById("cloud-bin").value = data.metadata.id;
          localStorage.setItem("jr_bin_key", key);
          localStorage.setItem("jr_bin_id", data.metadata.id);
          showToast("Bin Created Successfully!");
        }
      } catch (e) { alert("Error creating bin."); }
    });

    document.getElementById("btn-cloud-save").addEventListener("click", () => {
      localStorage.setItem("jr_bin_key", document.getElementById("cloud-key").value.trim());
      localStorage.setItem("jr_bin_id", document.getElementById("cloud-bin").value.trim());
      document.getElementById("modal-cloud").classList.remove("open");
      showToast("Cloud Settings Saved!");
    });

    render();
  });
</script>
</body>
</html>
