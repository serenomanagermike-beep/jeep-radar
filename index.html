<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JeepRadar // Florida Gulf Coast</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f0d;
      color: #e5e7eb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background-color: #121714;
      border-bottom: 2px solid #2d3829;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-row { display: flex; align-items: center; gap: 12px; }
    .brand-title { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: 1px; }
    .brand-title span { color: #f59e0b; }
    .badge {
      background: #f59e0b;
      color: #000;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .btn-share {
      background: linear-gradient(180deg, #f59e0b, #d97706);
      color: #000;
      font-weight: 700;
      font-size: 13px;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
    }
    .btn-share:hover { background: #d97706; }
    .toolbar {
      background: #18201a;
      border-bottom: 1px solid #2d3829;
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 16px;
    }
    .tool-group { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    select, input[type="range"] {
      background: #0b0f0d;
      color: #fff;
      border: 1px solid #3d4d38;
      padding: 5px 8px;
      border-radius: 4px;
      font-size: 13px;
    }
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      padding: 20px;
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    @media (max-width: 900px) {
      .main-grid { grid-template-columns: 1fr; }
    }
    .feed-panel { display: flex; flex-direction: column; gap: 12px; }
    .status-bar {
      background: #121714;
      border: 1px solid #2d3829;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
    }
    .event-card {
      background: #151c17;
      border: 1px solid #2d3829;
      border-left: 4px solid #f59e0b;
      padding: 14px;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .event-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .event-title { font-size: 16px; font-weight: 700; color: #fff; }
    .event-group { font-size: 11px; color: #f59e0b; font-weight: 600; text-transform: uppercase; }
    .event-dist { font-size: 14px; font-weight: 700; color: #f59e0b; }
    .event-desc { font-size: 13px; color: #cbd5e1; line-height: 1.4; }
    .event-meta { font-size: 12px; color: #94a3b8; display: flex; gap: 16px; flex-wrap: wrap; }
    .card-actions { display: flex; gap: 8px; margin-top: 4px; }
    .btn-action {
      background: #242f26;
      border: 1px solid #3d4d38;
      color: #fff;
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-action:hover { background: #334335; }
    .map-panel {
      background: #121714;
      border: 1px solid #2d3829;
      border-radius: 4px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .map-header {
      padding: 8px 12px;
      background: #18201a;
      font-size: 12px;
      font-weight: 700;
      color: #cbd5e1;
      border-bottom: 1px solid #2d3829;
    }
    #radarMap {
      width: 100%;
      height: 440px;
      background: #0f1411;
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      padding: 16px;
    }
    .modal-box {
      background: #151c17;
      border: 2px solid #f59e0b;
      border-radius: 6px;
      max-width: 500px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-box textarea {
      width: 100%;
      background: #0b0f0d;
      border: 1px solid #2d3829;
      color: #cbd5e1;
      padding: 10px;
      font-size: 12px;
      font-family: monospace;
      resize: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-row">
      <div class="brand-title">JEEP<span>RADAR</span></div>
      <div class="badge">Tampa Bay & Gulf</div>
    </div>
    <button class="btn-share" onclick="openShareModal()">Share App with Crew</button>
  </header>

  <section class="toolbar">
    <div class="tool-group">
      <label for="baseSelect"><strong>Base:</strong></label>
      <select id="baseSelect" onchange="changeBaseLocation(this.value)">
        <option value="madeira">Madeira Beach, FL</option>
        <option value="stpete">St. Pete Beach</option>
        <option value="tampa">Tampa Downtown</option>
        <option value="croom">Brooksville / Croom</option>
      </select>
    </div>

    <div class="tool-group">
      <label for="radiusSlider"><strong>Radius:</strong> <span id="radiusLabel" style="color:#f59e0b;">50 mi</span></label>
      <input id="radiusSlider" type="range" min="10" max="150" value="50" step="5" oninput="updateRadius(this.value)">
    </div>
  </section>

  <main class="main-grid">
    <div class="feed-panel">
      <div class="status-bar">
        <span>Scanned Clubs: <strong>SPB Jeepers, Sunshine City, TBJC</strong></span>
        <span>Found: <strong id="countDisplay" style="color:#f59e0b;">0</strong> Events</span>
      </div>
      <div id="cardsContainer"></div>
    </div>

    <div class="map-panel">
      <div class="map-header">TRAIL & EVENT RADAR MAP</div>
      <div id="radarMap"></div>
    </div>
  </main>

  <!-- SHARE MODAL -->
  <div id="shareModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3 style="color:#fff;">Share JeepRadar with Crew</h3>
      <p style="font-size:12px; color:#94a3b8;">Copy message or send directly via SMS with home screen instructions.</p>
      
      <div style="display:flex; gap:8px;">
        <input id="sharePhone" type="tel" placeholder="Phone number (optional)" style="flex:1;">
        <button class="btn-share" onclick="sendSmsDirect()">Send SMS</button>
      </div>

      <textarea id="shareText" rows="6" readonly></textarea>

      <div style="display:flex; justify-content:space-between;">
        <button class="btn-action" onclick="copyShareText()">Copy to Clipboard</button>
        <button class="btn-action" onclick="closeShareModal()">Close</button>
      </div>
    </div>
  </div>

      croom:   { lat: 28.5910, lng: -82.2612, name: "Brooksville / Croom" }
    };
