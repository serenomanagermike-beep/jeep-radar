<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>JeepRadar // Pinellas & Tampa Bay</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <style>
    :root {
      --radar-green: #22c55e;
      --radar-bg: #0b0f17;
      --tactical-amber: #f59e0b;
    }
    body {
      background-color: #0b0f17;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    #map {
      width: 100%;
      height: 100%;
      min-height: 480px;
      background: #111827;
      z-index: 10;
    }
    .leaflet-popup-content-wrapper {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.6);
    }
    .leaflet-popup-tip {
      background: #1e293b;
    }
    .radar-sweep-active {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 320px;
      height: 320px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
      border: 2px solid rgba(34, 197, 94, 0.4);
      background: conic-gradient(from 0deg, rgba(34, 197, 94, 0.3) 0deg, rgba(34, 197, 94, 0) 60deg, transparent 60deg);
      animation: sweep 3s linear infinite;
      z-index: 500;
    }
    @keyframes sweep {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-lg bg-emerald-500/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400 font-black text-xl">
        <i class="fa-solid fa-compass"></i>
      </div>
      <div>
        <h1 class="text-lg font-bold tracking-wider uppercase text-slate-100 flex items-center gap-2">
          JeepRadar <span class="text-xs px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">PINELLAS/TB</span>
        </h1>
        <p class="text-xs text-slate-400">Live Drops • St. Pete Beach • Sunshine City • TBJC</p>
      </div>
    </div>
    <div class="flex items-center space-x-2">
      <button id="locateRigBtn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 text-xs px-3 py-2 rounded font-semibold flex items-center gap-1.5 transition">
        <i class="fa-solid fa-location-crosshairs text-emerald-400"></i> My Rig
      </button>
      <button id="toggleRadarBtn" class="bg-emerald-600 hover:bg-emerald-500 text-slate-950 text-xs px-3 py-2 rounded font-bold flex items-center gap-1.5 transition shadow-sm">
        <i class="fa-solid fa-satellite-dish"></i> Sweep
      </button>
    </div>
  </header>

  <!-- Main View -->
  <div class="flex-1 flex flex-col md:flex-row relative">
    
    <!-- Map Container -->
    <div class="relative flex-1 w-full h-[55vh] md:h-[calc(100vh-61px)]">
      <div id="map"></div>
      <div id="radarSweep" class="radar-sweep-active hidden"></div>

      <!-- Quick Reset Controls Overlay -->
      <div class="absolute top-4 right-4 z-[400] flex flex-col gap-2">
        <button id="resetViewBtn" class="bg-slate-900/90 hover:bg-slate-800 border border-slate-700/80 text-xs text-slate-300 px-3 py-2 rounded shadow backdrop-blur font-medium">
          <i class="fa-solid fa-arrows-rotate mr-1 text-slate-400"></i> Reset Grid
        </button>
      </div>
    </div>

    <!-- Sidebar / Drop List -->
    <div class="w-full md:w-96 bg-slate-900 border-t md:border-t-0 md:border-l border-slate-800 flex flex-col h-[45vh] md:h-[calc(100vh-61px)]">
      
      <!-- Filter Bar -->
      <div class="p-3 border-b border-slate-800 flex items-center gap-2 overflow-x-auto">
        <button class="filter-btn active text-xs font-semibold px-2.5 py-1.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shrink-0" data-filter="all">All Drops</button>
        <button class="filter-btn text-xs font-semibold px-2.5 py-1.5 rounded bg-slate-800 text-slate-400 border border-slate-700 shrink-0" data-filter="spb">SPB Jeepers</button>
        <button class="filter-btn text-xs font-semibold px-2.5 py-1.5 rounded bg-slate-800 text-slate-400 border border-slate-700 shrink-0" data-filter="scjc">Sunshine City</button>
        <button class="filter-btn text-xs font-semibold px-2.5 py-1.5 rounded bg-slate-800 text-slate-400 border border-slate-700 shrink-0" data-filter="tbjc">TBJC</button>
      </div>

      <!-- Event Feed -->
      <div id="dropList" class="flex-1 overflow-y-auto p-3 space-y-3">
        <!-- Rendered via JS -->
      </div>

      <!-- Status Footer -->
      <div class="p-3 bg-slate-950/80 border-t border-slate-800 text-[11px] text-slate-400 flex items-center justify-between">
        <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Tactical Net Online</span>
        <span>Jeep Wave: 100%</span>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <script>
    // Pinellas & Tampa Bay Jeep Meet Drops
    const drops = [
      {
        id: 1,
        title: "Sunset Tailgate & Ducking",
        club: "spb",
        clubName: "St. Pete Beach Jeepers",
        location: "Upham Beach, St. Pete Beach",
        lat: 27.7397,
        lng: -82.7483,
        time: "Sundays @ 5:30 PM",
        desc: "Casual beachside chill, top/doors off, wave check and duck swaps.",
        icon: "fa-sun",
        badge: "Weekly"
      },
      {
        id: 2,
        title: "Causeway Causeway Run",
        club: "scjc",
        clubName: "Sunshine City Jeep Crew",
        location: "Courtney Campbell Causeway",
        lat: 27.9739,
        lng: -82.6074,
        time: "Friday Nights @ 7:00 PM",
        desc: "Cruise from St. Pete out to the Causeway spit. Line up on the water side.",
        icon: "fa-water",
        badge: "Cruise"
      },
      {
        id: 3,
        title: "Bayside Rig Showcase",
        club: "tbjc",
        clubName: "Tampa Bay Jeep Club",
        location: "Gandy Beach Shoreline",
        lat: 27.8726,
        lng: -82.5786,
        time: "Every 2nd Saturday",
        desc: "Back your wheels right up to the bay. Recovery gear checks, mod setups, and food.",
        icon: "fa-shield-halved",
        badge: "Meet"
      },
      {
        id: 4,
        title: "Clearwater Beach Convoy",
        club: "scjc",
        clubName: "Sunshine City Jeep Crew",
        location: "Pier 60 Lots, Clearwater Beach",
        lat: 27.9772,
        lng: -82.8276,
        time: "Monthly @ 11:00 AM",
        desc: "Gulf convoy through Clearwater down Gulf Blvd.",
        icon: "fa-truck-pickup",
        badge: "Convoy"
      },
      {
        id: 5,
        title: "Mod Night & Wrench Talk",
        club: "tbjc",
        clubName: "Tampa Bay Jeep Club",
        location: "Central Ave & 28th St N, St. Pete",
        lat: 27.7712,
        lng: -82.6710,
        time: "Thursdays @ 6:30 PM",
        desc: "Lift installs, lighting wires, suspension dial-in, and garage talk.",
        icon: "fa-wrench",
        badge: "Wrenching"
      }
    ];

    // Default center: Pinellas County / Tampa Bay
    const defaultCenter = [27.82, -82.68];
    const defaultZoom = 11;

    // Initialize Map
    const map = L.map('map', {
      zoomControl: true
    }).setView(defaultCenter, defaultZoom);

    // FIX: Using CartoDB Dark Matter unblocked tile server
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd',
      maxZoom: 19
    }).addTo(map);

    // Staggered size invalidation prevents blank tiles on load
    setTimeout(() => { map.invalidateSize(); }, 200);
    setTimeout(() => { map.invalidateSize(); }, 600);
    window.addEventListener('resize', () => { map.invalidateSize(); });

    // Custom tactical marker icon
    function createTacticalIcon(isUser = false) {
      const bgClass = isUser ? 'bg-amber-500' : 'bg-emerald-500';
      const iconClass = isUser ? 'fa-location-dot' : 'fa-truck-pickup';
      return L.divIcon({
        className: 'custom-pin',
        html: `<div style="
          width: 32px;
          height: 32px;
          border-radius: 50%;
          background: ${isUser ? '#f59e0b' : '#10b981'};
          display: flex;
          align-items: center;
          justify-content: center;
          color: #020617;
          border: 2px solid #ffffff;
          box-shadow: 0 0 12px ${isUser ? 'rgba(245,158,11,0.8)' : 'rgba(16,185,129,0.8)'};
        ">
          <i class="fa-solid ${iconClass}" style="font-size: 14px;"></i>
        </div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -18]
      });
    }

    const markers = [];

    // Render Markers on Map
    function renderMarkers(filterClub = 'all') {
      // Clear existing markers
      markers.forEach(m => map.removeLayer(m));
      markers.length = 0;

      const filtered = filterClub === 'all' 
        ? drops 
        : drops.filter(d => d.club === filterClub);

      filtered.forEach(drop => {
        const marker = L.marker([drop.lat, drop.lng], { icon: createTacticalIcon(false) })
          .addTo(map)
          .bindPopup(`
            <div class="text-left p-1">
              <span class="text-[10px] uppercase font-bold tracking-wider text-emerald-400">${drop.clubName}</span>
              <h3 class="text-sm font-bold text-slate-100 mt-0.5">${drop.title}</h3>
              <p class="text-xs text-slate-300 mt-1"><i class="fa-solid fa-location-dot text-slate-400 mr-1"></i>${drop.location}</p>
              <p class="text-xs text-amber-400 font-semibold mt-1"><i class="fa-regular fa-clock mr-1"></i>${drop.time}</p>
              <p class="text-xs text-slate-400 mt-2 border-t border-slate-700/60 pt-2">${drop.desc}</p>
            </div>
          `);
        markers.push(marker);
      });
    }

    // Render Sidebar Cards
    function renderList(filterClub = 'all') {
      const listContainer = document.getElementById('dropList');
      listContainer.innerHTML = '';

      const filtered = filterClub === 'all' 
        ? drops 
        : drops.filter(d => d.club === filterClub);

      if (filtered.length === 0) {
        listContainer.innerHTML = `<div class="p-6 text-center text-xs text-slate-500">No drops found for this crew.</div>`;
        return;
      }

      filtered.forEach(drop => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/80 hover:bg-slate-800 border border-slate-700 rounded-lg p-3 cursor-pointer transition flex flex-col gap-1.5 shadow-sm";
        card.innerHTML = `
          <div class="flex items-start justify-between">
            <span class="text-[10px] font-bold uppercase tracking-wider text-emerald-400">${drop.clubName}</span>
            <span class="text-[10px] bg-slate-700 text-slate-300 px-2 py-0.5 rounded font-medium">${drop.badge}</span>
          </div>
          <h4 class="text-sm font-bold text-slate-100">${drop.title}</h4>
          <p class="text-xs text-slate-400 flex items-center gap-1"><i class="fa-solid fa-location-dot text-slate-500"></i> ${drop.location}</p>
          <p class="text-xs text-amber-400 font-medium flex items-center gap-1"><i class="fa-regular fa-clock text-amber-500"></i> ${drop.time}</p>
        `;
        card.onclick = () => {
          map.setView([drop.lat, drop.lng], 14, { animate: true });
          const marker = markers.find(m => {
            const pos = m.getLatLng();
            return Math.abs(pos.lat - drop.lat) < 0.0001 && Math.abs(pos.lng - drop.lng) < 0.0001;
          });
          if (marker) marker.openPopup();
        };
        listContainer.appendChild(card);
      });
    }

    // Filter Buttons logic
    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.className = "filter-btn text-xs font-semibold px-2.5 py-1.5 rounded bg-slate-800 text-slate-400 border border-slate-700 shrink-0";
        });
        btn.className = "filter-btn active text-xs font-semibold px-2.5 py-1.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 shrink-0";
        const filter = btn.getAttribute('data-filter');
        renderMarkers(filter);
        renderList(filter);
      });
    });

    // Reset View Button
    document.getElementById('resetViewBtn').addEventListener('click', () => {
      map.setView(defaultCenter, defaultZoom, { animate: true });
    });

    // Radar Sweep Toggle
    const sweepElement = document.getElementById('radarSweep');
    document.getElementById('toggleRadarBtn').addEventListener('click', () => {
      sweepElement.classList.toggle('hidden');
    });

    // Locate Rig (GPS)
    let userMarker = null;
    document.getElementById('locateRigBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        alert("Geolocation not supported by this browser.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        pos => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          if (userMarker) map.removeLayer(userMarker);
          userMarker = L.marker([lat, lng], { icon: createTacticalIcon(true) })
            .addTo(map)
            .bindPopup(`<strong class="text-amber-400 text-xs">YOUR RIG</strong><br><span class="text-xs text-slate-300">Live GPS Lock</span>`)
            .openPopup();
          map.setView([lat, lng], 14, { animate: true });
        },
        err => {
          alert("GPS lock failed or was denied: " + err.message);
        },
        { enableHighAccuracy: true }
      );
    });

    // Initial population
    renderMarkers('all');
    renderList('all');
  </script>
</body>
</html>
